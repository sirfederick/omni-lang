name: Linux source and SDK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install supported build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang python3 libssl-dev nodejs libnode-dev
      - name: Run the shared local acceptance command
        run: bash tools/ci.sh
