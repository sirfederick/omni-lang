name: Bug report
description: Report a reproducible problem in Omni Language or its integrated SDK.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Omni Language and integrated SDK `0.1.0.00` are WIP / NOT_RELEASED. Use a short, descriptive title.
        Remove secrets and private data from examples and logs.
        For vulnerabilities, follow [SECURITY.md](https://github.com/sirfederick/omni-lang/blob/main/SECURITY.md) and email [hola@omni-lang.com](mailto:hola@omni-lang.com) privately. Do not post vulnerability details in Issues or Discussions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Briefly describe what goes wrong and when it happens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Omni version or commit
      description: Include the source commit if known.
      placeholder: "0.1.0.00 WIP, commit SHA"
  - type: dropdown
    id: surface
    attributes:
      label: Affected area
      options:
        - Compiler
        - Runtime
        - C SDK
        - Node N-API
        - Python ctypes
        - Standard library
        - Tools
        - Documentation
        - Other
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture and relevant toolchain or binding versions.
      placeholder: "Ubuntu 24.04 / WSL, x86-64, GCC 13.3, Clang 18, Python 3.12"
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest example, exact command or steps, and any setup needed. For documentation, include the page and steps.
      placeholder: |
        1. Create a minimal .omni file with the source below.
        2. Run python3 -B tools/omni_dev.py check path/to/repro.omni
        3. Observe the result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happens instead? Include the exit code or diagnostic if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only relevant output after removing secrets, private paths and personal data.
      render: text
